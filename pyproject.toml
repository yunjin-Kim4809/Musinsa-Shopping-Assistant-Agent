[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "musinsa-shopping-agent"
version = "1.0.0"
description = "무신사 쇼핑 도움 에이전트 - 가격 비교, 취향 기반 추천, 리뷰 요약 백엔드"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "tavily-python>=0.3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
llm = ["openai>=1.30"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
musinsa-agent = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # 한국어 주석/문서 문자열의 줄 길이는 유연하게

[tool.ruff.lint.flake8-bugbear]
# FastAPI 의 Depends(...) 기본 인자 패턴은 관례이므로 허용
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
